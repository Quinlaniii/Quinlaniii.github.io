<header class="top-header">
    <img src="logo.png" alt="Логотип" class="header-logo">
</header>
<body>
<h1 id="mainTitle">Антон Балясников</h1>
<p class="txt1">Могучий программист.</p>
<script>
let age;
let isConfirmed = false;
do {
    age = prompt("Введите ваш возраст:");
    if (age === null) {
        alert("Товарищ майор уже выехал.");
        window.location.replace('https://lawinweb.ru/vozrastnaya-markirovka-sajtov/');
        break; 
    }
    isConfirmed = confirm(`Вы уверены, что вам ${age}?`);
} while (!isConfirmed);
if (isConfirmed) {
    alert("Возраст подтвержден. Спасибо!");
}
</script>
<input type="text" id="userInput" placeholder="Введите фамилию">
<button id="changeBtn">Присвоить инновацию</button>
<script>
const title = document.getElementById('mainTitle');
const input = document.getElementById('userInput');
const button = document.getElementById('changeBtn');
button.addEventListener('click', function() {
    const newText = input.value;
    if (newText.trim() !== "") {
        title.textContent = "Антон " + newText;
        input.value = "";
    } else {
        alert("Просто так не жми!");
    }
});
</script>
</body>
<style>
body {
font-family: Tahoma, serif;
}
h1 {
color: #505050;
font-size: 36px;
text-shadow: 4px 4px 3px grey;
}
.txt1{
    color: darkgrey;
    text-align: center;
}
.txt1:hover{
    color:chocolate;
    border: 2px solid black;
    border-radius: 8px;
}
.top-header {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100px;
    background-color: #f4f4f4;
}
.header-logo {
    height: 100px;
    width: auto;
}
button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
    /* Изменение цвета при наведении из image_e7a8ff.png */
    transition: background-color 0.3s;
}
button:hover {
    background-color: #0056b3;
}
input {
    padding: 10px;
    font-size: 16px;
    border: 2px solid #ccc; /* Рамка из image_e7a8ff.png */
    border-radius: 5px;
    margin-bottom: 10px;
}
</style>
